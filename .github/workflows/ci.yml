name: CI
on: [push, pull_request]
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: golang:${{ matrix.go-version }}-trixie

    services:
      # enough databases for the pool that tests coordinate their claims on (see TestMain)
      valkey7:
        image: valkey/valkey:7.2-alpine
        env:
          VALKEY_EXTRA_FLAGS: --databases 64
      valkey8:
        image: valkey/valkey:8.1-alpine
        env:
          VALKEY_EXTRA_FLAGS: --databases 64

    strategy:
      matrix:
        go-version: ["1.25", "1.26", "1.27"]
        valkey-host: [valkey7, valkey8]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Run tests
      env:
        VALKEY_HOST: ${{ matrix.valkey-host }}
      run: go test -p=1 ./...


  test-all:
    name: Test
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all matrix legs passed
        run: test "${{ needs.test.result }}" = "success"
